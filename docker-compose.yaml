services:
  mongo:
    image: mongo:7
    container_name: atp-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: tenis-dev
    volumes:
      - atp-mongo-data:/data/db

volumes:
  atp-mongo-data: